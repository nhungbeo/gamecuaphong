<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Game Phong - Bộ Sưu Tập Hay Nhất</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            min-height: 100vh;
            color: #f3f4f6;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            transform: translateY(-8px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.2);
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(99, 102, 241, 0.6), 0 0 20px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-indigo-500 to-purple-500 mb-4 neon-text">
                PHONG GAME PORTAL
            </h1>
            <p class="text-gray-400 text-lg max-w-xl mx-auto">
                Phiên bản tốt nhất, mượt mà nhất và không lỗi của từng thể loại game.
            </p>
        </header>

        <!-- Search & Filter Controls -->
        <div class="flex flex-col md:flex-row gap-4 justify-between items-center mb-10">
            <!-- Search -->
            <div class="relative w-full md:w-96">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Tìm kiếm trò chơi..." 
                    class="w-full px-5 py-3 rounded-xl bg-slate-900/80 border border-slate-800 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all"
                >
            </div>
            <!-- Category Tabs -->
            <div class="flex gap-2 bg-slate-900/60 p-1.5 rounded-xl border border-slate-800/80 overflow-x-auto max-w-full">
                <button onclick="filterCategory('all')" id="tab-all" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition-all bg-indigo-600 text-white">
                    Tất cả
                </button>
                <button onclick="filterCategory('3d')" id="tab-3d" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold text-gray-400 hover:text-white transition-all">
                    Hành Động 3D
                </button>
                <button onclick="filterCategory('mythology')" id="tab-mythology" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold text-gray-400 hover:text-white transition-all">
                    Cổ Đại & Thần Thoại
                </button>
                <button onclick="filterCategory('creative')" id="tab-creative" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold text-gray-400 hover:text-white transition-all">
                    Giải Trí & Khác
                </button>
            </div>
        </div>

        <!-- Games Grid -->
        <div id="games-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Game Cards will be generated by JavaScript -->
        </div>
    </div>

    <script>
        const games = [
            {
                title: "Survival Horror 3D (Mượt Nhất)",
                file: "fps_3d_horror.html",
                desc: "Game bắn súng sinh tồn góc nhìn thứ nhất (FPS) 3D kinh dị. Trang bị đèn pin, nhảy né quái vật, thay đạn chân thực.",
                category: "3d",
                tags: ["Three.js", "FPS", "Âm thanh", "Kinh dị"],
                color: "from-red-500 to-purple-600"
            },
            {
                title: "Đền Thờ Tứ Linh",
                file: "den_tho_co_dai.html",
                desc: "Bảo vệ kết giới đền thờ trước bầy yêu ma phương Bắc bằng kỹ năng tối thượng của Thanh Long, Bạch Hổ, Huyền Vũ, Chu Tước.",
                category: "mythology",
                tags: ["Chiến thuật", "Thần thoại", "Phép thuật"],
                color: "from-yellow-500 to-red-600"
            },
            {
                title: "Câu Cá Tứ Thần Thú",
                file: "cau_ca_tu_thu.html",
                desc: "Thử thách kéo cá và săn lùng 15 thần thú truyền thuyết. Hãy nhấp nhả dây câu khéo léo để tránh đứt dây.",
                category: "creative",
                tags: ["Câu cá", "Giải trí", "Kỹ năng"],
                color: "from-cyan-500 to-emerald-600"
            },
            {
                title: "Neon Fury",
                file: "neon_fury.html",
                desc: "Những màn rượt đuổi tốc độ cao trong mê cung ánh sáng Neon rực rỡ.",
                category: "3d",
                tags: ["Arcade", "Neon", "Tốc độ"],
                color: "from-sky-400 to-indigo-600"
            },
            {
                title: "Nova Defender 3D",
                file: "nova_defender.html",
                desc: "Trò chơi bắn tàu vũ trụ 3D không gian rực rỡ. Điều khiển chiến cơ bắn phá thiên thạch và tàu địch bảo vệ ngân hà.",
                category: "3d",
                tags: ["Three.js", "Two.js", "Space", "Shooter"],
                color: "from-purple-500 to-indigo-700"
            },
            {
                title: "Cyber Runner 3D",
                file: "cyber_runner.html",
                desc: "Trò chơi chạy vô tận 3D Synthwave rực rỡ. Trượt né chướng ngại vật laser, nhảy cao và thu thập pha lê năng lượng.",
                category: "3d",
                tags: ["Three.js", "Two.js", "Runner", "Synthwave"],
                color: "from-pink-500 to-rose-700"
            }
        ];

        let currentCategory = 'all';

        function renderGames() {
            const grid = document.getElementById('games-grid');
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            
            grid.innerHTML = '';
            
            const filtered = games.filter(game => {
                const matchesCategory = currentCategory === 'all' || game.category === currentCategory;
                const matchesSearch = game.title.toLowerCase().includes(searchVal) || 
                                      game.desc.toLowerCase().includes(searchVal) ||
                                      game.tags.some(tag => tag.toLowerCase().includes(searchVal));
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <p class="text-slate-500 text-lg">Không tìm thấy trò chơi nào phù hợp.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(game => {
                const card = document.createElement('div');
                card.className = 'glass-card rounded-2xl overflow-hidden p-6 flex flex-col justify-between';
                
                const tagBadges = game.tags.map(tag => 
                    `<span class="px-2.5 py-1 text-xs font-medium bg-slate-800 text-slate-300 rounded-full">${tag}</span>`
                ).join(' ');

                card.innerHTML = `
                    <div>
                        <div class="h-1.5 w-12 bg-gradient-to-r ${game.color} rounded-full mb-4"></div>
                        <h3 class="text-xl font-bold mb-2 text-white hover:text-indigo-400 transition-colors">${game.title}</h3>
                        <p class="text-slate-400 text-sm mb-4 leading-relaxed">${game.desc}</p>
                    </div>
                    <div>
                        <div class="flex flex-wrap gap-1.5 mb-5">
                            ${tagBadges}
                        </div>
                        <a href="${game.file}" target="_blank" class="w-full inline-flex justify-center items-center px-4 py-2.5 rounded-xl text-sm font-bold bg-gradient-to-r ${game.color} text-white hover:opacity-90 transition-opacity">
                            Chơi Ngay
                            <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white');
                btn.classList.add('text-gray-400', 'hover:text-white');
            });
            
            const activeTab = document.getElementById(`tab-${cat}`);
            if (activeTab) {
                activeTab.classList.remove('text-gray-400', 'hover:text-white');
                activeTab.classList.add('bg-indigo-600', 'text-white');
            }
            
            renderGames();
        }

        document.getElementById('search-input').addEventListener('input', renderGames);
        renderGames();
    </script>
</body>
</html>
